name = "spend-gate"
main = "src/worker.ts"
compatibility_date = "2026-05-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
TYPESAFE_MODEL = "jev-latest"
TASK_FIT_THRESHOLD = "0.55"
VALUE_THRESHOLD = "0.5"
# Jev cost + margin per decision (USDC via x402)
GATE_PRICE_USD = "0.001"
# mainnet Base USDC so fees can offset real TypeSafe cost
X402_NETWORK = "base"
X402_FACILITATOR_URL = "https://x402.org/facilitator"
# After X402_PAY_TO is set: refuse free calls if secret missing on a fresh env
X402_REQUIRED = "true"

# Secrets:
#   npx wrangler secret put TYPESAFE_API_KEY
#   npx wrangler secret put X402_PAY_TO
